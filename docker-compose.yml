services:
  echo-web:
    # Built locally by CI/CD after the VPS pulls the base image from Docker
    # Hub. The tag is purely local; `docker compose up -d --build` works the
    # same for local development.
    image: echo_english:latest
    build:
      context: .
    container_name: echo-loop-web
    restart: unless-stopped
    # Bind to localhost only — the host's Caddy reverse-proxies your domain to
    # it (HTTPS handled by Caddy), so the app is never exposed to the public
    # internet directly. Override HOST_BIND only if you proxy from elsewhere.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      # Google Cloud TTS credentials (mounted read-only below).
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google-credentials.json
      # Where generated jobs are stored (mounted as a volume for persistence).
      ECHO_OUTPUT_DIR: /data/outputs
      # Optional shared secret. Leave empty on a private tailnet, or set it for
      # an extra layer. When set, the UI asks for it under ⚙️.
      ECHO_WEB_TOKEN: "${ECHO_WEB_TOKEN:-}"
      # Optional: OpenAI engine.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Optional auto-cleanup of generated audio (0 = keep forever).
      ECHO_RETENTION_DAYS: "${ECHO_RETENTION_DAYS:-0}"
      ECHO_MAX_JOBS: "${ECHO_MAX_JOBS:-0}"
      # Optional: sync each finished job's audio to Google Drive via rclone.
      # Enable by setting ECHO_SYNC_ENABLED=true + ECHO_SYNC_DEST in .env, and
      # mount a working rclone.conf (see volumes below). Disabled by default.
      ECHO_SYNC_ENABLED: "${ECHO_SYNC_ENABLED:-}"
      ECHO_SYNC_METHOD: "${ECHO_SYNC_METHOD:-rclone}"
      ECHO_SYNC_DEST: "${ECHO_SYNC_DEST:-}"
      ECHO_SYNC_LAYOUT: "${ECHO_SYNC_LAYOUT:-run_folder}"
      ECHO_SYNC_INCLUDE_LRC: "${ECHO_SYNC_INCLUDE_LRC:-true}"
      BIND_ADDR: 0.0.0.0
      PORT: 8080
    volumes:
      - ./outputs:/data/outputs
      - ./google-credentials.json:/secrets/google-credentials.json:ro
      - ./config.yaml:/app/config.yaml:ro
      # rclone remote config for Google Drive sync. Mounted read-write so rclone
      # can refresh and persist the OAuth access token. The file must exist on
      # the host before `up` (copy it from a machine where `rclone config` set up
      # the gdrive: remote). Only used when ECHO_SYNC_METHOD=rclone.
      - ./rclone.conf:/root/.config/rclone/rclone.conf
