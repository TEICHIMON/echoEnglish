services:
  echo-web:
    # Pulled from Docker Hub by CI/CD (GitHub Actions builds + pushes on every
    # push to main). For local development you can still build it yourself with
    # `docker compose up -d --build`.
    image: sudami/echo_english:latest
    build: .
    container_name: echo-loop-web
    restart: unless-stopped
    # Bind to localhost only — the host's Caddy reverse-proxies your domain to
    # it (HTTPS handled by Caddy), so the app is never exposed to the public
    # internet directly. Override HOST_BIND only if you proxy from elsewhere.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      # Google Cloud TTS credentials (mounted read-only below).
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/google-credentials.json
      # Where generated jobs are stored (mounted as a volume for persistence).
      ECHO_OUTPUT_DIR: /data/outputs
      # Optional shared secret. Leave empty on a private tailnet, or set it for
      # an extra layer. When set, the UI asks for it under ⚙️.
      ECHO_WEB_TOKEN: "${ECHO_WEB_TOKEN:-}"
      # Optional: OpenAI engine.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Optional auto-cleanup of generated audio (0 = keep forever).
      ECHO_RETENTION_DAYS: "${ECHO_RETENTION_DAYS:-0}"
      ECHO_MAX_JOBS: "${ECHO_MAX_JOBS:-0}"
      BIND_ADDR: 0.0.0.0
      PORT: 8080
    volumes:
      - ./outputs:/data/outputs
      - ./google-credentials.json:/secrets/google-credentials.json:ro
      - ./config.yaml:/app/config.yaml:ro
