name: Deploy

# SSHes into the VPS, pulls the latest code, and builds the image right there.
# No registry is involved at deploy time: the VPS's route to Docker Hub
# (registry-1.docker.io) fails with TLS handshake timeouts, and pushing to
# GHCR just to pull it back on the same box adds a dependency for nothing.
# The python:3.12-slim base image is already in the VPS's local Docker cache
# (from the original manual build), so `docker compose build` never needs to
# reach Docker Hub. Don't clear that cached base image.
on:
  push:
    branches: [main]
    # Skip deploys for doc-only / CLI-only changes that don't affect the image.
    paths-ignore:
      - "**/*.md"
      - "logs/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          # pip install of requirements-web can be slow on a small VPS; the
          # action's default 10m command timeout is too tight for a cold build.
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            # BuildKit resolves FROM metadata against registry-1.docker.io even
            # when the base image is cached locally, which times out on this
            # VPS. The legacy builder trusts the local cache, so force it —
            # but fail loudly first if the cached base image ever goes missing.
            docker image inspect python:3.12-slim > /dev/null
            export DOCKER_BUILDKIT=0
            # Build before `up` so a failed build leaves the running container
            # untouched.
            docker compose build
            docker compose up -d
            # Clean up: drop the registry-tagged images left over from the old
            # pull-based deploys (no longer referenced by compose), then any
            # dangling layers from superseded builds.
            docker image rm ghcr.io/teichimon/echo_english:latest sudami/echo_english:latest 2>/dev/null || true
            docker image prune -f
