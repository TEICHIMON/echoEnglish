name: Deploy

# The VPS pulls the base image and builds the application locally. GitHub
# Actions only connects over SSH to update and deploy the checked-out source.
on:
  push:
    branches: [main]
    # Skip deploys for doc-only / CLI-only changes that don't affect the image.
    paths-ignore:
      - "**/*.md"
      - "logs/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          # pip install of requirements-web can be slow on a small VPS; the
          # action's default 10m command timeout is too tight for a cold build.
          command_timeout: 30m
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            # Build before `up` so a failed build leaves the running container
            # untouched.
            docker compose build --pull
            docker compose up -d --remove-orphans
            docker image rm ghcr.io/teichimon/echo_english:latest sudami/echo_english:latest 2>/dev/null || true
            docker image prune -f
